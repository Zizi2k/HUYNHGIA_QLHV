name: Live exercise integration
on:
  push:
    branches: [feature/live-class-exercise]
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/live-exercise.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-root
          MYSQL_DATABASE: live_exercise_test
          MYSQL_USER: fixture
          MYSQL_PASSWORD: fixture-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: node --test tests/liveExercise.test.js tests/liveExercise.http.test.js
        working-directory: backend
        env:
          LIVE_EXERCISE_MYSQL: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: live_exercise_test
          DB_USER: fixture
          DB_PASSWORD: fixture-password
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
